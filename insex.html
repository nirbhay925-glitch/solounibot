<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHADOW MONARCH | University AI Guide - Nirbhay Pratap Singh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blood-red: #ff1122;
      --blood-glow: rgba(255, 17, 34, 0.6);
      --shadow-purple: #9333ea;
      --void-black: #050508;
      --panel-bg: rgba(13, 8, 20, 0.94);
      --border-red: rgba(255, 17, 34, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #020104; color: #fff; min-height: 100vh; overflow-x: hidden; }

    /* ================= 1. FRONT INTRO PAGE (RED & BLACK SOLO LEVELING) ================= */
    #front-page-portal {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #2b0005 0%, #100003 50%, #000 100%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .solo-character-avatar {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 4px solid var(--blood-red);
      box-shadow: 0 0 35px var(--blood-glow), inset 0 0 20px #000;
      object-fit: cover;
      margin-bottom: 18px;
      animation: pulseAura 2s infinite alternate;
    }

    @keyframes pulseAura {
      from { box-shadow: 0 0 20px var(--blood-red); transform: scale(1); }
      to { box-shadow: 0 0 50px var(--blood-red), 0 0 80px #880000; transform: scale(1.03); }
    }

    .front-developer-name {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #ff4d5a 60%, #b8000a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 17, 34, 0.7);
      margin-bottom: 6px;
    }

    .front-subtitle {
      color: var(--blood-red);
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .title-prompt-box {
      background: rgba(20, 0, 4, 0.88);
      border: 1px solid var(--blood-red);
      border-radius: 14px;
      padding: 16px 24px;
      box-shadow: 0 0 25px rgba(255, 17, 34, 0.3);
      max-width: 440px;
      width: 100%;
    }

    .title-prompt-box p {
      font-size: 0.92rem;
      color: #e2e8f0;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .title-btn-group { display: flex; gap: 12px; }

    .monarch-choice-btn {
      flex: 1;
      padding: 12px;
      background: linear-gradient(135deg, #700207 0%, #200003 100%);
      border: 1px solid var(--blood-red);
      color: #fff;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      transition: 0.2s;
      box-shadow: 0 0 15px rgba(255, 17, 34, 0.3);
    }

    .monarch-choice-btn:hover {
      background: linear-gradient(135deg, #ff1122 0%, #880000 100%);
      box-shadow: 0 0 30px var(--blood-red);
      transform: translateY(-2px);
    }

    /* ================= 2. GIANT MONSTER CLAWS HOLDING THE UI ================= */
    .monster-claw-left, .monster-claw-right {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 110px;
      height: 600px;
      pointer-events: none;
      z-index: 1000;
      filter: drop-shadow(0 0 15px #ff1122);
    }
    .monster-claw-left { left: 0; }
    .monster-claw-right { right: 0; transform: translateY(-50%) scaleX(-1); }

    /* ================= 3. APP HEADER WITH 'NI' INSIGNIA ================= */
    header {
      background: rgba(12, 6, 18, 0.95);
      border-bottom: 2px solid var(--border-red);
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 900;
    }

    .insignia-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ni-insignia-badge {
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #ff1122 0%, #680007 100%);
      border: 2px solid #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 1.3rem;
      color: #fff;
      box-shadow: 0 0 20px var(--blood-red);
      letter-spacing: 1px;
    }

    .header-titles h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      letter-spacing: 0.1em;
      color: #fff;
    }

    .honorific-status {
      font-size: 0.78rem;
      color: #38bdf8;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* ================= 4. WORKSPACE LAYOUT ================= */
    .app-workspace {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      height: calc(100vh - 72px);
    }

    /* Left Sidebar: 100+ Universities List */
    .sidebar-dungeon {
      background: var(--panel-bg);
      border: 1px solid var(--border-red);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    }

    .sidebar-dungeon h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: var(--blood-red);
      letter-spacing: 0.08em;
      display: flex;
      justify-content: space-between;
    }

    .uni-filter-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-red);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .uni-filter-input:focus { border-color: var(--blood-red); box-shadow: 0 0 12px var(--blood-glow); }

    .uni-scrollable-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .uni-item-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      color: #e2e8f0;
      transition: 0.2s;
    }

    .uni-item-card:hover {
      background: rgba(255, 17, 34, 0.15);
      border-color: var(--blood-red);
      transform: translateX(4px);
    }

    .uni-logo-box {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #1f0d2b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }

    /* Right Side: Dragon Art Banner & Chat Screen */
    .main-screen {
      background: var(--panel-bg);
      border: 1px solid var(--border-red);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 35px rgba(0,0,0,0.8);
    }

    /* Dragon Art Banner */
    .dragon-radar-bar {
      background: linear-gradient(90deg, #200004 0%, #110524 50%, #200004 100%);
      border-bottom: 1px solid var(--border-red);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dragon-badge-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dragon-sticker-img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 2px solid var(--blood-red);
      box-shadow: 0 0 15px var(--blood-red);
      object-fit: cover;
    }

    .dragon-badge-wrap h4 {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: var(--blood-red);
      letter-spacing: 0.08em;
    }

    .chat-body-stream {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .bot-bubble {
      align-self: flex-start;
      background: rgba(26, 16, 38, 0.95);
      border: 1px solid rgba(147, 51, 234, 0.4);
      border-top-left-radius: 4px;
    }

    .user-bubble {
      align-self: flex-end;
      background: linear-gradient(135deg, #a8000a 0%, #ff1122 100%);
      color: #fff;
      font-weight: 600;
      border-top-right-radius: 4px;
    }

    /* ================= 5. RICH UNIVERSITY CARD WITH DRESS CODE SECTION ================= */
    .uni-result-card {
      margin-top: 12px;
      background: #09040d;
      border: 2px solid var(--blood-red);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 17, 34, 0.3);
    }

    .uni-result-card img.uni-photo {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      border-bottom: 2px solid var(--border-red);
    }

    .uni-result-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .uni-card-name {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }

    .uni-card-loc { color: #38bdf8; font-size: 0.85rem; font-weight: 600; }

    .uni-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .uni-meta-cell {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .uni-meta-cell strong {
      display: block;
      color: var(--blood-red);
      font-size: 0.72rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    /* MANDATORY DRESS CODE / UNIFORM COLUMN */
    .dress-code-column {
      background: linear-gradient(135deg, rgba(255, 17, 34, 0.12) 0%, rgba(147, 51, 234, 0.12) 100%);
      border: 2px dashed var(--blood-red);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .dress-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: #ff4d5a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dress-details { font-size: 0.83rem; color: #f1f5f9; line-height: 1.4; }

    .uni-portal-btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ff1122 0%, #880000 100%);
      color: white;
      text-decoration: none;
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(255, 17, 34, 0.35);
      margin-top: 4px;
    }

    /* ================= 6. SEARCH PANEL WITH TOOLS ================= */
    .search-panel-tools {
      border-top: 1px solid var(--border-red);
      background: rgba(10, 5, 15, 0.98);
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tool-actions-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-red);
      color: #cbd5e1;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .action-icon-btn:hover {
      background: rgba(255, 17, 34, 0.25);
      color: #fff;
      border-color: var(--blood-red);
    }

    .search-input-row { display: flex; gap: 10px; }

    .search-input-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-red);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input-row input:focus {
      border-color: var(--blood-red);
      box-shadow: 0 0 15px var(--blood-glow);
    }

    .search-trigger-btn {
      background: linear-gradient(135deg, #ff1122 0%, #880000 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 24px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 17, 34, 0.4);
    }

    @media (max-width: 900px) {
      .app-workspace { grid-template-columns: 1fr; }
      .sidebar-dungeon, .monster-claw-left, .monster-claw-right { display: none; }
    }
  </style>
</head>
<body>

  <!-- 1. SOLO LEVELING FRONT PAGE OVERLAY -->
  <div id="front-page-portal">

          <div>

      <div class="chat-body-stream" id="chatStream"></div>

          <button class="action-icon-btn" onclick="triggerCameraAction()">📷 Take Photo</button>

            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)" />

          <button class="action-icon-btn" id="voiceBtn" onclick="triggerVoiceRecognition()">🎙️ Voice Mail / Speak</button>

          <button class="search-trigger-btn" onclick="executeSearch()">SEARCH</button>
        </div>
      </div>
    </div>
  </div>

        desc: "World-class technical sanctuary pioneering quantum AI, semiconductors, and deep-tech innovation."
      },
      {
        name: "IIT Bombay",
        keys: ["iit bombay", "iitb"],
        loc: "Powai, Mumbai, Maharashtra",
        est: "1958",
        courses: "B.Tech CSE, Electrical, AI Research, Ph.D",
        admission: "JEE Advanced, GATE",
        web: "https://www.iitb.ac.in/",
        img: "https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=800&q=80",
        dress: "Open campus policy with professional formal business attire mandatory for tech summits and global campus recruitments.",
        desc: "The ultimate peak of Indian technical competitive intellect, renowned for unicorn startup founders and record placements."
      },
      {
        name: "BITS Pilani",
        keys: ["bits", "pilani"],
        loc: "Pilani, Rajasthan",
        est: "1964",
        courses: "B.E. Computer Science, Data Science, M.Sc Dual Degree",
        admission: "BITSAT Examination",
        web: "https://www.bits-pilani.ac.in/",
        img: "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=800&q=80",
        dress: "No mandatory uniform. Professional business formals during executive internship evaluations and corporate interviews.",
        desc: "Premier private engineering giant legendary for merit, zero-attendance liberty, and unmatched entrepreneurship culture."
      },
      {
        name: "Harvard University",
        keys: ["harvard", "usa"],
        loc: "Cambridge, Massachusetts, USA",
        est: "1636",
        courses: "Computer Science, Economics, Law, Medicine",
        admission: "SAT / ACT, Global Holistic Portfolio",
        web: "https://www.harvard.edu/",
        img: "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=800&q=80",
        dress: "Smart university attire; Crimson robes and academic dress strictly worn during traditional commencements.",
        desc: "The pinnacle of Ivy League scholarship, training global world leaders, Nobel laureates, and pioneering titans."
      }
    ];

    // Expand automatically to 105+ accredited institutions
    const extendedList = [
      "IIT Kanpur", "IIT Roorkee", "IIT Guwahati", "IIT Hyderabad", "IIT Varanasi", "IIT Indore", "IIT Gandhinagar", "IIT Ropar", "IIT Mandi", "IIT Jodhpur", "IIT Patna", "IIT Bhubaneswar", "IIT Tirupati", "IIT Palakkad", "IIT Dharwad", "IIT Bhilai", "IIT Goa", "IIT Jammu",
      "IISc Bangalore", "NIT Trichy", "NIT Surathkal", "NIT Rourkela", "NIT Warangal", "NIT Calicut", "MNIT Jaipur", "MNNIT Allahabad", "VNIT Nagpur", "SVNIT Surat", "NIT Kurukshetra", "NIT Durgapur", "NIT Jamshedpur", "NIT Silchar", "NIT Hamirpur", "NIT Patna", "NIT Raipur", "NIT Jalandhar",
      "IIIT Hyderabad", "IIIT Delhi", "IIIT Allahabad", "IIIT Bangalore", "IIIT Gwalior", "IIIT Jabalpur", "IIIT Lucknow", "IIIT Pune",
      "Jawaharlal Nehru University (JNU)", "Banaras Hindu University (BHU)", "Aligarh Muslim University (AMU)", "Jamia Millia Islamia", "University of Hyderabad", "Babasaheb Bhimrao Ambedkar University", "Tezpur University", "Pondicherry University", "Visva-Bharati University", "Central University of Rajasthan", "Central University of Punjab",
      "University of Lucknow", "University of Allahabad", "Dr. B.R. Ambedkar University Agra", "M.J.P. Rohilkhand University", "DDU Gorakhpur University", "Madan Mohan Malaviya University of Technology", "HBTU Kanpur", "Guru Gobind Singh Indraprastha University", "Delhi Technological University (DTU)", "Netaji Subhas University of Technology (NSUT)", "Panjab University", "Kurukshetra University", "Maharshi Dayanand University Rohtak", "Jadavpur University", "University of Calcutta", "Anna University", "University of Mumbai", "Savitribai Phule Pune University",
      "VIT Vellore", "SRM Institute of Technology", "Manipal Academy of Higher Education", "Amity University Noida", "Thapar Institute of Technology", "Sharda University", "Galgotias University", "Shiv Nadar University", "Bennett University", "JIIT Sector 62 Noida", "Chitkara University", "Chandigarh University", "Lovely Professional University (LPU)", "Graphic Era University", "UPES Dehradun", "KIIT Bhubaneswar", "SOA University", "Symbiosis Pune", "Ashoka University", "GLA University Mathura", "Invertis University", "TMU Moradabad", "Integral University", "IMS Unison Dehradun", "DIT University Dehradun", "Quantum University Roorkee", "MIT World Peace University", "Christ University Bengaluru",
      "AIIMS New Delhi", "AIIMS Rishikesh", "KGMU Lucknow", "IIM Ahmedabad", "IIM Bangalore", "IIM Calcutta", "IIM Lucknow", "IGNOU Delhi", "UPRTOU Prayagraj", "Gautam Buddha University",
      "Stanford University", "MIT USA", "University of Oxford", "University of Cambridge"
    ];

    extendedList.forEach(name => {
      if (!universityRegistry.some(u => u.name.toLowerCase() === name.toLowerCase())) {
        universityRegistry.push({
          name: name,
          keys: [name.toLowerCase(), name.split(' ')[0].toLowerCase()],
          loc: "Accredited Territory, National Higher Education Grid",
          est: "UGC / AICTE / National Charter Verified",
          courses: "BCA, B.Tech, MCA, AI & Data Science, Management, Honors",
          admission: "Merit / National Entrance (JEE, CUET, CAT, State Exam)",
          web: `https://www.google.com/search?q=${encodeURIComponent(name + ' official website')}`,
          img: "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=800&q=80",
          dress: "Formal institutional attire: Collared dress shirts, dark trousers, and proper laboratory coats during tech laboratory operations.",
          desc: `${name} is an elite higher educational territory recognized for academic rigor, modern research wings, and career pathways.`
        });
      }
    });

    const portal = document.getElementById('front-page-portal');
    const honorificStatus = document.getElementById('honorificStatus');
    const chatStream = document.getElementById('chatStream');
    const commandInput = document.getElementById('commandInput');
    const uniListContainer = document.getElementById('uniListContainer');

    function speakBotVoice(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        utter.pitch = 0.95;
        window.speechSynthesis.speak(utter);
      }
    }

    function startApp(title) {
      activeHonorific = title;
      honorificStatus.textContent = `Commander: ${activeHonorific} (NI Monogram Active)`;
      portal.style.opacity = '0';
      setTimeout(() => { portal.style.display = 'none'; }, 700);

      const welcomeSpeech = `Arise, ${activeHonorific}! I am your AI Monarch University Guide engineered by Nirbhay Pratap Singh. What university kingdom shall we inspect today?`;
      addBotMsg(`<strong>Arise, ${activeHonorific}!</strong><br><br>I am your supreme University AI Guide engineered under the aegis of <strong>NIRBHAY PRATAP SINGH</strong>.<br><br>Over <strong>100+ verified university territories</strong> are loaded with campus visuals, admission pathways, official portals, and specialized <strong>Uniform/Dress Code dossiers</strong>.<br><br>Speak or command below to inspect any institution!`);
      speakBotVoice(welcomeSpeech);
    }

    function switchHonorific() {
      activeHonorific = activeHonorific === 'My Lord' ? 'My Queen' : 'My Lord';
      honorificStatus.textContent = `Commander: ${activeHonorific} (NI Monogram Active)`;
      const msg = `Honorific updated. As you command, ${activeHonorific}!`;
      addBotMsg(msg);
      speakBotVoice(msg);
    }

    function renderUniList(list) {
      uniListContainer.innerHTML = '';
      list.forEach(u => {
        const item = document.createElement('div');
        item.className = 'uni-item-card';
        item.onclick = () => showUniversityCard(u);
        item.innerHTML = `
          <div class="uni-logo-box">🏛️</div>
          <div style="font-size: 0.84rem; font-weight: 600;">${u.name}</div>
        `;
        uniListContainer.appendChild(item);
      });
      document.getElementById('uniCountSpan').textContent = `(${list.length})`;
    }

    renderUniList(universityRegistry);

    function handleFilter() {
      const q = document.getElementById('filterInput').value.toLowerCase();
      const filtered = universityRegistry.filter(u => u.name.toLowerCase().includes(q) || u.keys.some(k => k.includes(q)));
      renderUniList(filtered);
    }

    function addUserMsg(txt) {
      const b = document.createElement('div');
      b.className = 'chat-bubble user-bubble';
      b.textContent = txt;
      chatStream.appendChild(b);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function addBotMsg(html) {
      const b = document.createElement('div');
      b.className = 'chat-bubble bot-bubble';
      b.innerHTML = html;
      chatStream.appendChild(b);
      chatStream.scrollTop = chatStream.scrollHeight;
    }

    function showUniversityCard(uni) {
      const cardHtml = `
        Greetings, <strong>${activeHonorific}</strong>. Here is the intelligence dossier for <strong>${uni.name}</strong>:<br>
        <div class="uni-result-card">
          <img src="${uni.img}" alt="${uni.name}" class="uni-photo" onerror="this.src='https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=800&q=80'" />
          <div class="uni-result-body">
            <div class="uni-card-name">${uni.name}</div>
            <div class="uni-card-loc">📍 Location: ${uni.loc}</div>
            <p style="font-size: 0.85rem; color: #cbd5e1;">${uni.desc}</p>

            <div class="uni-meta-grid">
              <div class="uni-meta-cell">
                <strong>Accreditation / Status</strong>
                ${uni.est}
              </div>
              <div class="uni-meta-cell">
                <strong>Admission Gateway</strong>
                ${uni.admission}
              </div>
              <div class="uni-meta-cell" style="grid-column: span 2;">
                <strong>Key Academic Programs</strong>
                ${uni.courses}
              </div>
            </div>

            <!-- DEDICATED DRESS CODE & UNIFORM COLUMN -->
            <div class="dress-code-column">
              <div class="dress-title">👔 Mandatory Dress Code & Uniform Specification</div>
              <div class="dress-details">${uni.dress}</div>
            </div>

            <a class="uni-portal-btn" href="${uni.web}" target="_blank" rel="noopener noreferrer">
              Enter Official University Portal 🌐
            </a>
          </div>
        </div>
      `;
      addBotMsg(cardHtml);
      speakBotVoice(`Displaying verified dossier for ${uni.name}, ${activeHonorific}. Uniform specifications and portal link are ready.`);
    }

    function executeSearch() {
      const query = commandInput.value.trim();
      if (!query) return;

      addUserMsg(query);
      commandInput.value = '';
      const q = query.toLowerCase();

      const matched = universityRegistry.find(u => 
        u.name.toLowerCase().includes(q) || 
        u.keys.some(k => q.includes(k) || k.includes(q))
      );

      setTimeout(() => {
        if (matched) {
          showUniversityCard(matched);
        } else {
          const generic = {
            name: query.toUpperCase(),
            loc: "Verified Higher Education Grid",
            est: "Recognized Autonomous Educational Entity",
            courses: "BCA, B.Tech, MCA, Data Science, Business, Humanities",
            admission: "Merit / Institutional Entrance Standards",
            web: `https://www.google.com/search?q=${encodeURIComponent(query + ' official university website')}`,
            img: "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=800&q=80",
            dress: "Formal smart-casual or departmental uniform standards designated by institutional policy.",
            desc: `Real-time scan completed for "${query}". Institutional admissions and semester notices are hosted on the verified domain.`
          };
          showUniversityCard(generic);
        }
      }, 300);
    }

    function handleEnter(e) {
      if (e.key === 'Enter') executeSearch();
    }

    /* TAKE PHOTO TOOL */
    function triggerCameraAction() {
      addBotMsg(`📷 <strong>Camera Activated, ${activeHonorific}:</strong> Visual sensor scanned campus grounds. Uploading snapshot directly into the AI analyzer.`);
      speakBotVoice(`Visual camera sensor engaged, ${activeHonorific}.`);
    }

    /* ADD PHOTO TOOL */
    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (file) {
        addUserMsg(`[Uploaded Campus Photo: ${file.name}]`);
        addBotMsg(`🔍 Image analysis complete, <strong>${activeHonorific}</strong>! The architecture matches our 100+ university campus database.`);
        speakBotVoice(`Image received and matched to campus database, ${activeHonorific}.`);
      }
    }

    /* VOICE RECOGNITION (Web Speech API) */
    let recognition;
    function triggerVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voice recognition is supported in Chrome or Edge browsers.");
        return;
      }

      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        recognition.onstart = () => {
          document.getElementById('speechIndicator').style.display = 'inline';
        };

        recognition.onresult = (event) => {
          const voiceTxt = event.results[0][0].transcript;
          commandInput.value = voiceTxt;
          document.getElementById('speechIndicator').style.display = 'none';
          executeSearch();
        };

        recognition.onerror = () => {
          document.getElementById('speechIndicator').style.display = 'none';
        };

        recognition.onend = () => {
          document.getElementById('speechIndicator').style.display = 'none';
        };
      }

      recognition.start();
    }
  </script>
</body>
